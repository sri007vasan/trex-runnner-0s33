<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polished Tic-Tac-Toe Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .game-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 2rem; width: 100%; max-width: 440px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; }
    .status-badge { font-size: 1.25rem; font-weight: bold; background: #090d16; color: #38bdf8; border: 1px solid #334155; border-radius: 12px; padding: 0.75rem 1rem; margin-bottom: 1.5rem; }
    .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .cell { aspect-ratio: 1; background: #334155; border: none; border-radius: 16px; font-size: 2.5rem; font-weight: 800; color: #fff; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
    .cell:hover { background: #475569; transform: scale(1.03); }
    .cell.x-mark { color: #f43f5e; text-shadow: 0 0 10px rgba(244,63,94,0.5); }
    .cell.o-mark { color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
    .btn-reset { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-weight: bold; font-size: 1rem; border-radius: 12px; padding: 0.75rem 2rem; border: none; width: 100%; transition: opacity 0.2s; }
    .btn-reset:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="game-card">
    <h2 class="h4 mb-3 text-indigo-400 font-bold">🎮 Tic-Tac-Toe Game</h2>
    <div id="game-status" class="status-badge">Player X's Turn</div>

    <div class="board-grid" id="tictactoe-board">
      <button class="cell" onclick="makeMove(0)" id="cell-0"></button>
      <button class="cell" onclick="makeMove(1)" id="cell-1"></button>
      <button class="cell" onclick="makeMove(2)" id="cell-2"></button>
      <button class="cell" onclick="makeMove(3)" id="cell-3"></button>
      <button class="cell" onclick="makeMove(4)" id="cell-4"></button>
      <button class="cell" onclick="makeMove(5)" id="cell-5"></button>
      <button class="cell" onclick="makeMove(6)" id="cell-6"></button>
      <button class="cell" onclick="makeMove(7)" id="cell-7"></button>
      <button class="cell" onclick="makeMove(8)" id="cell-8"></button>
    </div>

    <button class="btn btn-reset" onclick="resetGame()">🔄 Reset Game</button>
  </div>

  <script>
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function makeMove(index) {
      if (board[index] !== '' || !gameActive) return;

      board[index] = currentPlayer;
      const cell = document.getElementById('cell-' + index);
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer === 'X' ? 'x-mark' : 'o-mark');

      checkResult();
    }

    function checkResult() {
      let roundWon = false;
      for (let i = 0; i < winningConditions.length; i++) {
        const [a, b, c] = winningConditions[i];
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          roundWon = true;
          break;
        }
      }

      const status = document.getElementById('game-status');
      if (roundWon) {
        status.textContent = '🎉 Player ' + currentPlayer + ' Wins!';
        gameActive = false;
        return;
      }

      if (!board.includes('')) {
        status.textContent = '🤝 Game Draw!';
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      status.textContent = 'Player ' + currentPlayer + "'s Turn";
    }

    function resetGame() {
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameActive = true;
      document.getElementById('game-status').textContent = "Player X's Turn";

      for (let i = 0; i < 9; i++) {
        const cell = document.getElementById('cell-' + i);
        cell.textContent = '';
        cell.className = 'cell';
      }
    }
  </script>
</body>
</html>
